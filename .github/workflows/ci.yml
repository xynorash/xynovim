name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The same Neovim as platforms.yml. Bump version and checksum together
  # (checksum: gh api repos/neovim/neovim/releases/tags/<tag> --jq '.assets[] | [.name, .digest]').
  NVIM_VERSION: v0.12.5
  NVIM_LINUX_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
  # Lint tools, pinned the same way (release asset digest)
  STYLUA_VERSION: v2.6.0
  STYLUA_SHA256: a485f72bbfa22e4642e77a84b5edc2611a5cab7477b34e2e709dd8f78e919895
  LUALS_VERSION: 3.19.2
  LUALS_SHA256: 93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install StyLua (pinned, checksum verified)
        run: |
          curl -fsSL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          echo "${STYLUA_SHA256}  stylua.zip" | sha256sum -c -
          mkdir -p "$HOME/stylua"
          unzip -q stylua.zip -d "$HOME/stylua"
          echo "$HOME/stylua" >> "$GITHUB_PATH"

      - name: Install lua-language-server (pinned, checksum verified)
        run: |
          curl -fsSL -o luals.tar.gz "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz"
          echo "${LUALS_SHA256}  luals.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/luals"
          tar -xzf luals.tar.gz -C "$HOME/luals"
          echo "$HOME/luals/bin" >> "$GITHUB_PATH"

      - name: Format (stylua --check, config in stylua.toml)
        run: stylua --check .

      - name: Static check (lua-language-server --check, config in .luarc.json)
        run: lua-language-server --check . --checklevel=Warning --logpath "$RUNNER_TEMP/luals"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Neovim (pinned, checksum verified)
        run: |
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_LINUX_SHA256}  nvim.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/nvim"
          tar -xzf nvim.tar.gz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"

      - name: Use the checkout as the Neovim config
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Add rust-analyzer (a prerequisite the bootstrap script checks)
        run: rustup component add rust-analyzer clippy

      - name: Restore plugins from the lockfile
        run: scripts/bootstrap.sh

      - name: Lockfile unchanged
        run: git diff --exit-code lazy-lock.json

      - name: Startup smoke test
        run: |
          # Shared runners are noisy, so the time bound is generous: it only
          # catches regressions like a blocking network call or a require
          # loop. Any message on stderr (a failed plugin spec, a Lua error)
          # fails the job.
          start=$(date +%s%N)
          nvim --headless +qa 2> "$RUNNER_TEMP/startup.log"
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "headless startup: ${ms} ms"
          if [ -s "$RUNNER_TEMP/startup.log" ]; then cat "$RUNNER_TEMP/startup.log"; exit 1; fi
          if [ "$ms" -gt 3000 ]; then echo "startup slower than 3000 ms"; exit 1; fi

      - name: Spec suite
        # tests/*_spec.lua, each file in its own headless nvim with a hard
        # timeout. Specs whose tool is missing (bwrap cannot create a sandbox
        # on runners that restrict user namespaces) skip with a message.
        run: scripts/test.sh

      - name: Lockfile still unchanged after the specs
        run: git diff --exit-code lazy-lock.json
